std = "nvim"

# home/dot_config/nvim/lua/lsp/config/init.lua uses `goto`, a Lua 5.2 feature.
# selene 0.31.0 bundles only the lua51 and roblox std libraries, so this file
# cannot be parsed. Path is relative to the working directory, not this file.
exclude = ["home/dot_config/nvim/lua/lsp/config/init.lua"]

# Allowed because selene's lua51 std misjudges LuaJIT code: it rejects the
# `unpack = unpack or table.unpack` compat shim, and wrongly claims `assert`
# requires two arguments. The rest mirror the codes .luacheckrc suppressed.
[lints]
mixed_table = "allow"
unscoped_variables = "allow"
multiple_statements = "allow"
must_use = "allow"
bad_string_escape = "allow"
parenthese_conditions = "allow"
incorrect_standard_library_use = "allow"

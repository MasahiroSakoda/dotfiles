name: pull-request
on:
  pull_request:
    types:
      - opened
      - reopened
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pr-labeler:
    name: PR Labeler
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # To apply labels to the pull request
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          # workaround for sync-labels bug:
          # https://github.com/actions/labeler/issues/112#issuecomment-1000491676
          # sync-labels: ""
          configuration-path: ".github/labeler.yml"
  pr-assigner:
    name: Assign author to PR
    if: ${{ ! contains(fromJson('["renovate[bot]", "dependabot[bot]"]'), github.actor) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pull-requests: write # To assign the pull request author
    steps:
      - name: Assign author to PR
        uses: technote-space/assign-author@9558557c5c4816f38bd06176fbc324ba14bb3160 # v1.6.2
  validate-title:
    name: Validate PR title
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pull-requests: read # To read the pull request title
    steps:
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

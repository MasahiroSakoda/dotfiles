name: linter
on:
  pull_request:
    branches:
      - main
jobs:
  linter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write # To report GitHub Actions status checks
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          mise_toml: .github/mise.toml
          install: true
      - name: Collect changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only -z --diff-filter=ACMR "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed.z"
          grep -zE '\.(js|jsx|ts|tsx|vue|svelte|astro)$' "$RUNNER_TEMP/changed.z" \
            > "$RUNNER_TEMP/js.z" || true
          grep -zE '\.(sh|bash|zsh)$' "$RUNNER_TEMP/changed.z" \
            > "$RUNNER_TEMP/sh.z" || true
          grep -zE '\.lua$' "$RUNNER_TEMP/changed.z" \
            > "$RUNNER_TEMP/lua.z" || true
          for kind in changed js sh lua; do
            printf '%-8s %s file(s)\n' "$kind" \
              "$(tr -cd '\0' < "$RUNNER_TEMP/$kind.z" | wc -c | tr -d ' ')"
          done
      - name: Betterleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: betterleaks git --redact --no-banner --log-opts="$BASE_SHA..HEAD" .
      - name: Oxlint
        run: xargs -0 -r oxlint < "$RUNNER_TEMP/js.z"
      - name: Oxfmt
        run: |
          xargs -0 -r oxfmt --check --no-error-on-unmatched-pattern \
            < "$RUNNER_TEMP/changed.z"
      - name: Shellcheck
        run: |
          xargs -0 -r shellcheck \
            -e 1009 -e SC1054 -e SC1056 -e SC1072 -e SC1073 -e 1083 \
            < "$RUNNER_TEMP/sh.z"
      - name: Selene
        run: xargs -0 -r selene --config .github/selene.toml < "$RUNNER_TEMP/lua.z"

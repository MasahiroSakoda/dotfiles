name: linter
on:
  pull_request:
    branches:
      - main
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  linter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write # To report GitHub Actions status checks
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # Inline so a manifest change shows up in the workflow diff.
          #
          # This is NOT a trust boundary. `pull_request` runs the workflow from
          # the merge commit, so a fork can edit this block and install any
          # aqua package it names. GitHub downgrades the token to read-only
          # and withholds secrets for fork PRs, which is what actually bounds
          # the damage. Never add a secret to this job — doing so turns fork
          # PRs into arbitrary code execution with that secret.
          mise_toml: |
            [settings]
            minimum_release_age = "3d"
            gpg_verify          = true
            [tools]
            "aqua:koalaman/shellcheck"     = "0.11.0"
            "aqua:betterleaks/betterleaks" = "1.8.1"
            "aqua:oxc-project/oxc/oxfmt"   = "1.84.0"
            "aqua:oxc-project/oxc/oxlint"  = "1.84.0"
            "aqua:Kampfkarren/selene"      = "0.31.0"
          install: true
      - name: Collect changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only -z --diff-filter=ACMR "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed.z"
          grep -zE '\.(js|jsx|ts|tsx|vue|svelte|astro)$' "$RUNNER_TEMP/changed.z" \
            > "$RUNNER_TEMP/js.z" || true
          grep -zE '\.(sh|bash|zsh)$' "$RUNNER_TEMP/changed.z" \
            > "$RUNNER_TEMP/sh.z" || true
          grep -zE '\.lua$' "$RUNNER_TEMP/changed.z" \
            > "$RUNNER_TEMP/lua.z" || true
          for kind in changed js sh lua; do
            printf '%-8s %s file(s)\n' "$kind" \
              "$(tr -cd '\0' < "$RUNNER_TEMP/$kind.z" | wc -c | tr -d ' ')"
          done
      - name: Betterleaks
        continue-on-error: false
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: betterleaks git --redact --no-banner --log-opts="$BASE_SHA..HEAD" .
      - name: Oxlint
        continue-on-error: true
        run: xargs -0 -r oxlint -- < "$RUNNER_TEMP/js.z"
      - name: Oxfmt
        continue-on-error: true
        run: xargs -0 -r oxfmt --check --no-error-on-unmatched-pattern -- < "$RUNNER_TEMP/changed.z"
      - name: Shellcheck
        continue-on-error: true
        run: xargs -0 -r shellcheck -e 1009 -e SC1054 -e SC1056 -e SC1072 -e SC1073 -e 1083 -- < "$RUNNER_TEMP/sh.z"
      - name: Selene
        continue-on-error: true
        run: |
          # Inline so a config change shows up in the workflow diff.
          #
          # This is NOT a trust boundary. `pull_request` runs the workflow from
          # the merge commit, so a fork can edit this block just as it can edit
          # a checked-in config. The reviewed manifest is the point.
          #
          # selene resolves a custom `std` relative to the config file's own
          # directory, so nvim.toml has to be written beside selene.toml.
          cat > "$RUNNER_TEMP/selene.toml" <<'EOF'
          std = "nvim"

          # home/dot_config/nvim/lua/lsp/config/init.lua uses `goto`, a Lua 5.2
          # feature. selene 0.31.0 bundles only the lua51 and roblox std
          # libraries, so this file cannot be parsed. The path is relative to
          # the working directory, not to this config.
          exclude = ["home/dot_config/nvim/lua/lsp/config/init.lua"]

          # Allowed because selene's lua51 std misjudges LuaJIT code: it rejects
          # the `unpack = unpack or table.unpack` compat shim, and wrongly
          # claims `assert` requires two arguments. The rest mirror the codes
          # .luacheckrc suppressed.
          [lints]
          mixed_table = "allow"
          unscoped_variables = "allow"
          multiple_statements = "allow"
          must_use = "allow"
          bad_string_escape = "allow"
          parenthese_conditions = "allow"
          incorrect_standard_library_use = "allow"
          EOF
          cat > "$RUNNER_TEMP/nvim.toml" <<'EOF'
          [selene]
          base = "lua51"
          name = "nvim"
          description = "Host globals injected by Neovim and Hammerspoon at runtime"

          [vim]
          property = true

          [hs]
          property = true
          EOF
          xargs -0 -r selene --config "$RUNNER_TEMP/selene.toml" -- \
            < "$RUNNER_TEMP/lua.z"

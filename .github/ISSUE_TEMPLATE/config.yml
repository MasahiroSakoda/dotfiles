# yaml-language-server: $schema=https://www.schemastore.org/github-issue-config.json
blank_issues_enabled: false

contact_links:
  - name: Bug Report
    url: https://github.com/MasahiroSakoda/dotfiles/issues/new?template=bug_report.yml
    about: Report a Bug
  - name: Feature Request
    url: https://github.com/MasahiroSakoda/dotfiles/issues/new?template=feature_request.yml
    about: Request a feature to be added to the project
  - name: Chore / Maintenance
    url: https://github.com/MasahiroSakoda/dotfiles/issues/new?template=chore.yml
    about: Request a chore task to the project
  - name: Refactor
    url: https://github.com/MasahiroSakoda/dotfiles/issues/new?template=refactor.yml
    about: Request a refactor task to the project
  - name: Question & Discussions
    url: https://github.com/MasahiroSakoda/dotfiles/discussions
    about: Use GitHub discussions for message-board style questions and discussions.

[settings]
minimum_release_age  = "3d"

gpg_verify = true  # Use gpg to verify all tool signatures
lockfile   = true
pin        = true

[tools]
## Security
"aqua:betterleaks/betterleaks" = "1.10.1" # A Better Secrets Scanner built for configurability and speed

## GitHub Actions
"aqua:suzuki-shunsuke/pinact" = "5.0.2"  # Version Pinner for GitHub Actions
"github:jdx/jactionlint"      = "2.6.0"  # :octocat: Static checker for GitHub Actions workflow files

## Git
"aqua:evilmartians/lefthook" = "2.2.3" # Fast and powerful Git hooks manager for any type of projects.

## CLI
"aqua:shenwei356/rush" = "0.11.1"  # A cross-platform command-line tool for executing jobs in parallel

## Test
"aqua:bats-core/bats-core" = "1.14.0" # Bash Automated Testing System

## Formatter / Linter
"aqua:mvdan/sh"               = "3.14.1" # Shell formatter
"aqua:Kampfkarren/selene"     = "0.32.0" # Lua linter
"aqua:oxc-project/oxc/oxlint" = "latest" # high-performance linter for JavaScript and TypeScript built on the Oxc compiler stack
"aqua:oxc-project/oxc/oxfmt"  = "latest" # high-performance formatter for the JavaScript ecosystem
"aqua:crate-ci/typos"         = "1.52.2" # Typo

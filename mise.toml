[settings]
minimum_release_age  = "3d"

gpg_verify = true  # Use gpg to verify all tool signatures
lockfile   = true
pin        = true

[tools]
## Security
"aqua:betterleaks/betterleaks" = "1.9.0" # A Better Secrets Scanner built for configurability and speed

## GitHub Actions
"aqua:suzuki-shunsuke/pinact" = "5.0.1"  # Version Pinner for GitHub Actions
"aqua:rhysd/actionlint"       = "1.7.12" # YAML Linter for GitHub Actions workflows
"aqua:zizmorcore/zizmor"      = "1.31.1" # Static analysis for GitHub Actions

## Git
"aqua:evilmartians/lefthook" = "2.2.2" # Fast and powerful Git hooks manager for any type of projects.

## CLI
"aqua:shenwei356/rush" = "0.11.0"  # A cross-platform command-line tool for executing jobs in parallel

## Test
"aqua:bats-core/bats-core" = "1.14.0" # Bash Automated Testing System

## Formatter / Linter
"aqua:mvdan/sh"               = "3.14.1" # Shell formatter
"aqua:Kampfkarren/selene"     = "0.32.0" # Lua linter
"aqua:oxc-project/oxc/oxlint" = "1.84.0" # high-performance linter for JavaScript and TypeScript built on the Oxc compiler stack
"aqua:oxc-project/oxc/oxfmt"  = "1.84.0" # high-performance formatter for the JavaScript ecosystem
"aqua:crate-ci/typos"         = "1.51.1" # Typo

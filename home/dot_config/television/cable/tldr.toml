[metadata]
name         = "tldr"
description  = "Browse and preview TLDR help pages for command-line tools"
requirements = ["tldr"]

[source]
command = "tldr --list"

[preview]
command = "tldr '{0}' --color always"

[ui]
layout = "landscape"

  [ui.preview_panel]
  header = "{0}"
  footer = ""

[keybindings]
ctrl-e = "actions:open"

[actions.open]
description = "Open the selected TLDR page"
command     = "tldr '{0}'"
mode        = "execute"

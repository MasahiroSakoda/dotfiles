[metadata]
name         = "uv-packages"
description  = "Browse installed pip packages via uv"
requirements = ["uv"]

[source]
command = "uv pip list 2>/dev/null | tail -n +3 | awk '{print $1}'"
ansi    = true

[ui]
layout = "landscape"

  [ui.input_bar]
  position = "top"
  prompt   = "  "

  [ui.preview_panel]
  header = "{split:0}"
  footer = ""

[preview]
command = "uv pip show {} 2>/dev/null"

[keybindings]
alt-u = "actions:upgrade"
alt-d = "actions:uninstall"

[actions.upgrade]
description = "Upgrade the selected package"
command     = "uv pip install --upgrade {}"
mode        = "execute"

[actions.uninstall]
description = "Uninstall the selected package"
command     = "uv pip uninstall {}"
mode        = "execute"

[metadata]
name         = "brew-packages"
description  = "List and manage Homebrew packages"
requirements = ["brew"]

[source]
ansi    = true
display = "{split:\t:..}"
output  = "{split:\t:..}"

  [[source.command]]
  name = " Formulae"
  run  = """
    brew list --versions --json | jq -r '.formulae[] | [.name, .versions.[0], .pinned_version // "-"] | @tsv' | column -t -s (printf '\t')
  """

  [[source.command]]
  name = " Casks"
  run  = """
    brew list --versions --json | jq -r '.casks[] | [.token, .versions.[0], .pinned_version // "-"] | @tsv' | column -t -s (printf '\t')
  """

[ui]
layout = "landscape"

  [ui.input_bar]
  position = "top"
  prompt   = "  "

  [ui.preview_panel]
  header = "{0}"
  footer = ""

[preview]
command = "brew info '{0}'; echo \"\nDeps:\n$(brew deps {0})\""

[keybindings]
ctrl-u = "actions:upgrade"
ctrl-d = "actions:uninstall"

[actions.upgrade]
description = "Upgrade the selected package"
command     = "brew upgrade {}"
mode        = "execute"

[actions.uninstall]
description = "Uninstall the selected package"
command     = "brew uninstall {}"
mode        = "execute"

[metadata]
name         = "agents"
description  = "Browse agent instruction for current environment"
requirements = ["fd", "jq"]

[source]
command = [
  {
    name = "  Instruction",
    run  = "fd -t file --regex '(CLAUDE|AGENTS)\\.md'",
  }
]
ansi    = true
display = "{split:\\t:0..2}"
output  = "{split: :4}"

[ui]
layout = "landscape"

  [ui.input_bar]
  position = "top"
  prompt   = "  "

  [ui.preview_panel]
  header    = " {0}"
  footer    = ""
  scrollbar = true

[preview]
command = "glow {}"

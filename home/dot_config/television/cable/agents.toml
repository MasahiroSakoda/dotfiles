[metadata]
name         = "agents"
description  = "Browse agent instruction for current environment"
requirements = ["fd", "jq", "bat"]

[source]
ansi    = true
display = "{split:\\t:0..2}"
output  = "{split: :4}"

  [[source.command]]
  name = "  Instructions"
  run  = "fd -t file --regex '(CLAUDE|AGENTS)(\\.local)?\\.md'"

  [[source.command]]
  name = "  Subagents"
  run  = "fd -t d --regex '\\.claude\\/agents\\/.+\\.md|\\.codex\\/agents\\/.+\\.md|\\.opencode\\/agents?\\/.+\\.md'"

  [[source.command]]
  name = "  Plugins"
  run  = "fd -t d --regex '\\.claude\\/plugins|\\.agents\\/plugins|\\.opencode\\/plugins?'"

  [[source.command]]
  name = "  Settings"
  run  = "fd -t file --regex '\\.claude\\/settings\\.jsonc?|\\.codex\\/config\\.toml|opencode\\.jsonc?'"

[ui]
layout = "landscape"

  [ui.input_bar]
  position = "top"
  prompt   = "  "

  [ui.preview_panel]
  header    = " {0}"
  footer    = ""
  scrollbar = true

[preview]
command = "bat --style=grid --color=always '{}' || echo 'Not Found'"

  [preview.env]
  BAT_THEMES = "ansi"

[metadata]
name         = "pnpm-packages"
description  = "Browse project dependencies"
requirements = ["pnpm"]

[source]
display = "{regex_extract:([^/]+)@([\\d.]+):0}"
output  = "{regex_extract:([^/]+)@[\\d.]+:1}"

  [[source.command]]
  name = "dependencies"
  run  = "pnpm ls --depth 0 --parseable --long 2>/dev/null"

  [[source.command]]
  name = "devDependencies"
  run  = "pnpm ls --depth 0 --parseable --long --dev 2>/dev/null"

[ui]
layout = "landscape"

  [ui.input_bar]
  position = "top"
  prompt   = "  "

[preview]
command = "pnpm info '{}' 2>/dev/null | head -30"

[keybindings]
enter  = "actions:info"
ctrl-u = "actions:update"
ctrl-r = "actions:remove"

[actions.info]
description = "Show package info"
command     = "pnpm info '{}'"
mode        = "fork"

[actions.update]
description = "Update package to latest"
command     = "pnpm update '{}'"
mode        = "fork"

[actions.remove]
description = "Remove package"
command     = "pnpm remove '{}'"
mode        = "fork"

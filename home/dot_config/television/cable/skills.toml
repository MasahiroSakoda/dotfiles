[metadata]
name         = "skills"
description  = "Browse agent skills for current environment"
requirements = ["gh", "jq", "bat", "eza"]

[source]
ansi    = true
display = "{split:\\t:0..2}"
output  = "{split: :4}"

  [[source.command]]
  name = " Active"
  run  = """
    gh skill list --json skillName,version,sourceURL,scope,path 2>/dev/null |
    jq -r '.[] | select((.path | contains(".agents/skills")) and .version != "" and .sourceURL != "") | [.skillName, .version, .pinned // "-", (.sourceURL | sub("^https?://([^@/]+@)?github.com/"; "") | sub(".git$"; "")), .scope, .path] | @tsv' |
    column -t -s (printf '\t')
  """

  [[source.command]]
  name = " Project"
  run  = """
    gh skill list --scope project --json skillName,version,sourceURL,scope,path 2>/dev/null |
    jq -r '.[] | select((.path | contains(".agents/skills")) and .version != "" and .sourceURL != "") | [.skillName, .version, .pinned // "-", (.sourceURL | sub("^https?://([^@/]+@)?github.com/"; "") | sub(".git$"; "")), .scope, .path] | @tsv' |
    column -t -s (printf '\t')
  """

  [[source.command]]
  name = " Global"
  run  = """
   gh skill list --scope user --json skillName,sourceURL,version,scope,path 2>/dev/null |
   jq -r '.[] | select((.path | contains(".agents/skills")) and .version != "" and .sourceURL != "") | [.skillName, .version, .pinned // "-", (.sourceURL | sub("^https?://([^@/]+@)?github.com/"; "") | sub(".git$"; "")), .scope, .path] | @tsv' |
   column -t -s (printf '\t')
  """

[ui]
layout = "landscape"

  [ui.input_bar]
  position = "top"
  prompt   = "  "

  [ui.preview_panel]
  header    = " {0}"
  footer    = ""
  scrollbar = true

[preview]
command = [
  "bat --style=grid --language=md --color=always '{-1}'/SKILL.md",
  "bat --style=grid --language=md --color=always '{-1}'/README.md || echo 'No README'",
  "cd '{-1}'; eza -a -T -L 2 --header --icons always --color always --group-directories-first --git-ignore; echo; git log -n 200 --pretty=medium --all --graph --color",
]

  [preview.env]
  BAT_THEMES = "ansi"

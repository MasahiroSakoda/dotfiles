[metadata]
name         = "mise-tools"
description  = "Browse and manage mise tools"
requirements = ["mise", "jq"]

[source]
output = "{split:\t:..}"
ansi   = true

  [[source.command]]
  name = " Installed"
  run  = """
    mise ls --installed --json |
    jq -r 'to_entries[] | ["\\u001b[34m\\(.key)\\u001b[0m", "\\u001b[32m\\(.value[].version)\\u001b[0m", "\\(if .value[].active then "\\u001b[33mActive\\u001b[0m" else "Inactive" end)", (.value[].source.path | gsub(".*/"; "")), .value[].requested_version] | @tsv' |
    column -t -s (printf '\t')
  """

  [[source.command]]
  name = " Registered"
  run  = """
    mise registry --json 2>/dev/null |
    jq -r '.[] | ["\\u001b[34m\\(.short)\\u001b[0m", "\\u001b[36m\\(.backends.[0])\\u001b[0m", "\\u001b[37m\\(.description // "")\\u001b[0m"] | @tsv' |
    column -t -s (printf '\t')
  """

[ui]
layout = "landscape"

  [ui.input_bar]
  position = "top"
  prompt   = "  "

  [ui.preview_panel]
  header = "{strip_ansi|split: :0}"
  footer = "⌃ + ⏎: use"

[preview]
command = [
  "mise tool {strip_ansi|split: :0} --json | yq -p json -o yaml | bat --style=grid --language=yaml --color=always",
]

[keybindings]
ctrl-enter = "actions:use"
ctrl-u     = "actions:upgrade"
ctrl-d     = "actions:uninstall"

[actions.use]
description = "Install/activate the selected tool"
command     = "mise use --global '{0}@latest'"
mode        = "fork"

[actions.upgrade]
description = "Upgrade to latest version"
command     = "mise upgrade '{0}'"
mode        = "fork"

[actions.uninstall]
description = "Uninstall the selected tool"
command     = "mise uninstall '{0}'"
mode        = "fork"

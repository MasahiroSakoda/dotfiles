[metadata]
name         = "mise-tools"
description  = "Browse and manage mise tools"
requirements = ["mise", "jq"]

[source]
command = [
  {
    name = "Installed",
    run  = """
      mise ls --installed --json 2>/dev/null |
      jq -r 'to_entries[] | [.key, .value[].version, (if .value[].active then "Active" else "Inactive" end), (.value[].source.path | gsub(".*/"; "")), .value[].requested_version] | @tsv' |
      column -t -s (printf '\t')
    """
  },
  {
    name = "Registered",
    run  = """
      mise registry --json 2>/dev/null |
      jq -r '.[] | [.short, .backends.[0], (.description // "")] | @tsv' |
      column -t -s (printf '\t')
    """
  },
]
display = "{split:\t:..}"
output  = "{split:\t:..}"
ansi    = true

[ui]
layout = "landscape"

  [ui.preview_panel]
  header = "{0}"
  footer = "⏎: use | ⌃ + u: upgrade | ⌃ + d: uninstall | ⌃ + v: versions | ⌃ + r: releases"

[preview]
command = "mise tool {0}"

[keybindings]
enter      = "actions:info"
ctrl-enter = "actions:use"
ctrl-u     = "actions:upgrade"
ctrl-d     = "actions:uninstall"

[actions.info]
description = "Install/activate the selected tool"
command     = "mise tool '{0}'"
mode        = "execute"

[actions.use]
description = "Install/activate the selected tool"
command     = "mise use --global '{0}@latest'"
mode        = "fork"

[actions.upgrade]
description = "Upgrade to latest version"
command     = "mise upgrade '{0}'"
mode        = "fork"

[actions.uninstall]
description = "Uninstall the selected tool"
command     = "mise uninstall '{0}'"
mode        = "fork"
